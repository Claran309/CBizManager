services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-before-use}
      MYSQL_DATABASE: cbizdocsmanager
    ports:
      - "3306:3306"
    volumes:
      - cbizdocsmanager_mysql_data:/var/lib/mysql
    networks:
      - cbizdocsmanager
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-before-use}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - cbizdocsmanager_redis_data:/data
    networks:
      - cbizdocsmanager

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
      MYSQL_DSN: root:${MYSQL_ROOT_PASSWORD:-change-me-before-use}@tcp(mysql:3306)/cbizdocsmanager?charset=utf8mb4&parseTime=true&loc=UTC
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-before-use}
      JWT_SECRET: ${JWT_SECRET:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      CORS_ALLOW_CREDENTIALS: "false"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - cbizdocsmanager

volumes:
  cbizdocsmanager_mysql_data:
    name: cbizdocsmanager_mysql_data
  cbizdocsmanager_redis_data:
    name: cbizdocsmanager_redis_data

networks:
  cbizdocsmanager:
    name: cbizdocsmanager_network
