        member_type:
          type: string
          enum: [owner, member]
          nullable: true
        must_change_password:
          type: boolean
        permission_codes:
          type: array
          description: 当前身份在所属组内的权限码；平台管理员与主账号固定为空数组。
          items:
            $ref: '#/components/schemas/PermissionCode'
    MeApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeData'
    PasswordChangedData:
      type: object
      additionalProperties: false
      required: [changed]
      properties:
        changed:
          type: boolean
    PasswordChangedApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PasswordChangedData'
    GroupCreatedData:
      type: object
      additionalProperties: false
      required: [group, owner]
      properties:
        group:
          $ref: '#/components/schemas/GroupSummary'
        owner:
          $ref: '#/components/schemas/UserSummary'
    CreateGroupApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GroupCreatedData'
    InvitationCreatedData:
      type: object
      additionalProperties: false
      required: [invitation_id, invitation_code, group, expires_at]
      properties:
        invitation_id:
          type: integer
          format: int64
          minimum: 1
        invitation_code:
          type: string
          description: 邀请码明文；后续查询不得再次返回
        group:
          $ref: '#/components/schemas/GroupSummary'
        expires_at:
          type: string
          format: date-time
    CreateInvitationApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InvitationCreatedData'
    GroupStatus:
      type: string
      enum: [active, disabled]
    GroupSummaryData:
      type: object
      additionalProperties: false
      required: [id, name, status, owner, member_count, version, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
        status:
          $ref: '#/components/schemas/GroupStatus'
        owner:
          $ref: '#/components/schemas/UserSummary'
        member_count:
          type: integer
          format: int64
          minimum: 0
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupPageData:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GroupSummaryData'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    GroupPageApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
