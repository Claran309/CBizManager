components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestID:
      description: 本次请求的唯一追踪 ID
      schema:
        type: string
  parameters:
    GroupIdPath:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    InvitationIdPath:
      name: invitation_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MembershipIDPath:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DictionaryIDPath:
      name: dictionary_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    DocumentIDPath:
      name: document_id
      in: path
      required: true
      description: 单据主键 ID；超出当前账号数据范围时按「不存在」处理。
      schema:
        type: integer
        format: int64
        minimum: 1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: 客户端离线队列的幂等键；缺省表示不启用幂等。同一用户在同一接口用同一键重放，服务端返回首次结果；键相同但载荷不同则返回 IDEMPOTENCY_KEY_REUSED。
      schema:
        type: string
        maxLength: 191
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OriginHeader:
      name: Origin
      in: header
      required: true
      description: 必须命中服务端显式配置的 Web Origin 白名单
      schema:
        type: string
    CSRFHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: 必须与可读 CSRF Cookie 中的值一致
      schema:
        type: string
  responses:
    TokenExpired:
      description: 访问令牌无效或已过期（AUTH_TOKEN_EXPIRED）
      x-error-codes: [AUTH_TOKEN_EXPIRED]
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    InternalError:
      description: 服务内部错误（INTERNAL_ERROR）
      x-error-codes: [INTERNAL_ERROR]
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_REFRESH_INVALID
        - AUTH_PASSWORD_CHANGE_REQUIRED
        - USER_USERNAME_EXISTS
        - INVITATION_INVALID
        - INVITATION_EXPIRED
        - INVITATION_USED
        - INVITATION_NOT_FOUND
        - INVITATION_NOT_REVEALABLE
        - INVITATION_NOT_REVOKABLE
        - INVITATION_DECRYPT_FAILED
        - GROUP_NAME_EXISTS
        - GROUP_NOT_FOUND
        - OWNER_TARGET_INVALID
        - MEMBER_NOT_FOUND
        - MEMBER_OWNER_PROTECTED
        - MEMBER_SELF_OPERATION_FORBIDDEN
        - PERMISSION_CODE_INVALID
        - DICTIONARY_NOT_FOUND
        - DICTIONARY_NAME_EXISTS
        - DICTIONARY_PARENT_INVALID
        - DOCUMENT_NOT_FOUND
        - DOCUMENT_STATUS_INVALID
        - DOCUMENT_INCOMPLETE
        - IDEMPOTENCY_KEY_REUSED
        - RESOURCE_VERSION_CONFLICT
        - CSRF_INVALID
        - ORIGIN_FORBIDDEN
        - FORBIDDEN
        - INTERNAL_ERROR
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ApiResponse:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          description: 成功标识或稳定错误码
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
        request_id:
          type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [code, message, data, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            data:
              type: object
              nullable: true
            field_errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [invitation_code, username, password, display_name]
      properties:
        invitation_code:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          minLength: 1
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 8
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name, owner_username, owner_display_name, owner_temporary_password]
      properties:
        name:
          type: string
          minLength: 1
        owner_username:
          type: string
          minLength: 1
        owner_display_name:
          type: string
          minLength: 1
        owner_temporary_password:
          type: string
          format: password
