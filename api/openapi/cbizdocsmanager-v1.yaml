          format: int64
          minimum: 1
          description: 客户端持有的组版本号，用于乐观锁校验。
    ChangeGroupOwnerRequest:
      type: object
      additionalProperties: false
      required: [mode, version]
      properties:
        mode:
          type: string
          enum: [existing_member, new_account]
        membership_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: mode=existing_member 时必填，指向候选成员的关系 ID。
        username:
          type: string
          nullable: true
          description: mode=new_account 时必填。
        display_name:
          type: string
          nullable: true
          description: mode=new_account 时必填。
        temporary_password:
          type: string
          format: password
          nullable: true
          minLength: 8
          description: mode=new_account 时必填，长度不少于 8。
        version:
          type: integer
          format: int64
          minimum: 1
    OwnerChangedData:
      type: object
      additionalProperties: false
      required: [group, owner]
      properties:
        group:
          $ref: '#/components/schemas/GroupSummaryData'
