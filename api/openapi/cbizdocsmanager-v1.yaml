      type: string
      description: 单据类型；入库单与出库单共享同一套表结构与状态机，仅以该列区分。
      enum: [inbound, outbound]
    DocumentStatus:
      type: string
      description: 单据业务状态；一期只保留草稿、已提交、已作废三态，作废为终态。
      enum: [draft, submitted, voided]
    PriceTaxMode:
      type: string
      description: 明细单价类型，仅用于业务记录与展示，不改变「金额 = 单价 × 数量」。
      enum: [tax_included, tax_excluded]
    SaleAmountType:
      type: string
      description: 销售金额类型；仅出库单携带，稳定代码值保持不变，界面再翻译成中文。
      enum: ['Y-1', 'y-N', 'N']
    DocumentBusinessUserData:
      type: object
      additionalProperties: false
      description: 单据归属业务员的精简摘要；列表行只回填 id 与 display_name。
      required: [id, display_name]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        account_type:
          type: string
          enum: [platform_admin, group_owner, member]
    DocumentItemData:
      type: object
      additionalProperties: false
      description: 单据明细行；金额由服务端按单价 × 数量计算，客户端提交的金额一律忽略。
      required: [item_id, position, product_name, quantity, unit_price, price_tax_mode, amount]
      properties:
        item_id:
          type: integer
          format: int64
          minimum: 1
        position:
          type: integer
          minimum: 1
          description: 明细在所属往来单位内的展示序号，由服务端生成。
        product_name:
          type: string
        product_model:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        quantity:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,3})?$'
          description: 数量定点字符串，精确到千分之一，避免二进制浮点误差。
        weight:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,3})?$'
          nullable: true
        unit_price:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,4})?$'
          description: 单价定点字符串，精确到万分之一元。
        price_tax_mode:
          $ref: '#/components/schemas/PriceTaxMode'
        amount:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
          description: 金额定点字符串，精确到分；等于单价 × 数量四舍五入结果。
        remark:
          type: string
          nullable: true
    DocumentPartyData:
      type: object
      additionalProperties: false
      description: 往来单位；入库单为进项公司，出库单为客户。
      required: [party_id, position, party_name, subtotal, items]
      properties:
        party_id:
          type: integer
          format: int64
          minimum: 1
        position:
          type: integer
          minimum: 1
          description: 往来单位在单据内的展示序号，由服务端生成。
        party_name:
          type: string
        contact_phone:
          type: string
          nullable: true
        subtotal:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
          description: 该往来单位下所有明细金额之和。
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentItemData'
    DocumentData:
      type: object
      additionalProperties: false
      required: [document_id, kind, document_no, status, business_user, business_date, total_amount, total_amount_upper, version, created_at, updated_at, parties]
      properties:
        document_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/DocumentKind'
        document_no:
          type: string
          description: 单号，形如 RK/CK + 业务日期 + 当日 4 位序号。
        status:
          $ref: '#/components/schemas/DocumentStatus'
        business_user:
          $ref: '#/components/schemas/DocumentBusinessUserData'
        business_date:
          type: string
          format: date
        shipping_unit:
          type: string
          nullable: true
          description: 运输单位；仅出库单携带，入库单固定为 null。
        sale_amount_type:
          allOf:
            - $ref: '#/components/schemas/SaleAmountType'
          nullable: true
          description: 销售金额类型；仅出库单携带。
        total_amount:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
          description: 单据总金额（分）；作废单据仍保留原值。
        total_amount_upper:
          type: string
          description: 总金额人民币大写，由服务端生成，与三端展示一致。
        remark:
          type: string
          nullable: true
        version:
          type: integer
          format: int64
          minimum: 1
          description: 乐观锁版本号；每次成功写入自增。
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        parties:
          type: array
          items:
            $ref: '#/components/schemas/DocumentPartyData'
