      properties:
        group:
          $ref: '#/components/schemas/GroupSummaryData'
        member_counts:
          type: object
          description: 按成员状态聚合的人数，键为 active / disabled / removed。
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
        owner_candidates:
          type: array
          description: 可作为新主账号的现有成员（仅 active 成员）。
          items:
            $ref: '#/components/schemas/OwnerCandidateData'
    GroupDetailApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
