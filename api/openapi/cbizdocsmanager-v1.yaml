      type: object
      additionalProperties: false
      required: [document_id, kind, document_no, status, business_date, business_user, party_names, item_count, total_amount, version, created_at, updated_at]
      properties:
        document_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/DocumentKind'
        document_no:
          type: string
        status:
          $ref: '#/components/schemas/DocumentStatus'
        business_date:
          type: string
          format: date
        business_user:
          $ref: '#/components/schemas/DocumentBusinessUserData'
        shipping_unit:
          type: string
          nullable: true
        sale_amount_type:
          allOf:
            - $ref: '#/components/schemas/SaleAmountType'
          nullable: true
        party_names:
          type: array
          description: 单据内往来单位名称去重后的列表，用于列表页快速辨识。
          items:
            type: string
        item_count:
          type: integer
          minimum: 0
          description: 单据内明细总条数。
        total_amount:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
        version:
          type: integer
          format: int64
          minimum: 1
        submitted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentPageData:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentSummaryData'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    PartyTotalsData:
      type: object
      additionalProperties: false
      description: 月度汇总中按往来单位聚合的一行。
      required: [party_name, document_count, total_amount]
      properties:
        party_name:
          type: string
        document_count:
          type: integer
          format: int64
          minimum: 0
        total_amount:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
    MonthlySummaryData:
      type: object
      additionalProperties: false
      description: 月度汇总；作废单据计入 voided_count 但不计入 total_amount。
      required: [month, kind, document_count, draft_count, submitted_count, voided_count, total_amount, total_amount_upper, parties]
      properties:
        month:
          type: string
          description: 汇总月份，形如 2026-09。
        kind:
          $ref: '#/components/schemas/DocumentKind'
        document_count:
          type: integer
          format: int64
          minimum: 0
        draft_count:
          type: integer
          format: int64
          minimum: 0
        submitted_count:
          type: integer
          format: int64
          minimum: 0
        voided_count:
          type: integer
          format: int64
          minimum: 0
        total_amount:
          type: string
          pattern: '^-?\d{1,16}(\.\d{1,2})?$'
          description: 当月有效（非作废）单据金额合计。
        total_amount_upper:
          type: string
        parties:
          type: array
          description: 按往来单位聚合的金额排行（降序），长度受 bucket_size 限制。
          items:
            $ref: '#/components/schemas/PartyTotalsData'
    DocumentApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DocumentData'
    DocumentPageApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DocumentPageData'
    MonthlySummaryApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MonthlySummaryData'
    DocumentItemRequest:
      type: object
      additionalProperties: false
      description: 明细写入请求；金额由服务端计算，客户端不得提交 amount 字段。
      required: [product_name, quantity, unit_price, price_tax_mode]
      properties:
        product_name:
          type: string
          minLength: 1
        product_model:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        quantity:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,3})?$'
          description: 数量定点字符串；草稿允许为 0，提交时必须大于 0。
        weight:
          type: string
          pattern: '^-?\d{1,15}(\.\d{1,3})?$'
          nullable: true
        unit_price:
          type: string
          pattern: '^-?\d{1,14}(\.\d{1,4})?$'
          description: 单价定点字符串；草稿允许为 0，提交时必须大于 0。
        price_tax_mode:
          $ref: '#/components/schemas/PriceTaxMode'
        remark:
          type: string
          nullable: true
    DocumentPartyRequest:
      type: object
      additionalProperties: false
      required: [party_name, items]
      properties:
        party_name:
          type: string
          minLength: 1
        contact_phone:
          type: string
          nullable: true
          description: 联系电话；入库单不允许携带。
        dictionary_entry_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: 选填，指向辅助字典条目，便于后续统计口径归一。
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentItemRequest'
    CreateDocumentRequest:
      type: object
      additionalProperties: false
      required: [status, business_date, parties]
      properties:
        status:
          $ref: '#/components/schemas/DocumentStatus'
          description: 仅允许 draft 或 submitted；直接提交时校验必填完整。
        business_date:
          type: string
          description: 业务日期；兼容 2026-09-22 / 2026/9/22 / 2026 9 22 / 2026年9月22日 / 20260922 五种写法，非法日期一律拒绝。
        business_user_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: 业务员；缺省为当前登录用户，必须为所属组的有效成员。
        shipping_unit:
          type: string
          nullable: true
          description: 运输单位；仅出库单可携带。
        sale_amount_type:
          allOf:
            - $ref: '#/components/schemas/SaleAmountType'
          nullable: true
          description: 销售金额类型；仅出库单可携带，提交时必填。
        remark:
          type: string
          nullable: true
        parties:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentPartyRequest'
    UpdateDocumentRequest:
      type: object
      additionalProperties: false
      required: [version, status, business_date, parties]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 客户端持有的单据版本号，用于乐观锁校验。
        status:
          $ref: '#/components/schemas/DocumentStatus'
        business_date:
          type: string
        business_user_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        shipping_unit:
          type: string
          nullable: true
        sale_amount_type:
          allOf:
            - $ref: '#/components/schemas/SaleAmountType'
          nullable: true
        remark:
          type: string
          nullable: true
        parties:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DocumentPartyRequest'
    DocumentVersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
          description: 客户端持有的单据版本号，用于乐观锁校验。
