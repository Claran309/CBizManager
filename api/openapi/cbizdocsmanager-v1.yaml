    InvoiceStatus:
      type: string
      description: 单据维度的开票状态，由已开票金额与单据总额在服务端推导；出库单不存在开票概念，返回 not_applicable 而不是 none。
      enum: [none, partial, full, not_applicable]
    FinanceRecordData:
      type: object
      additionalProperties: false
      description: 一条付款 / 收款 / 开票记录。单号、往来单位、业务员与业务日期是登记时的单据快照，列表页不需要再查单据表。
      required:
        - record_id
        - kind
        - document_id
        - document_kind
        - document_no
        - party_name
        - business_user
        - business_date
        - amount
        - amount_upper
        - occurred_on
        - created_by
        - created_at
      properties:
        record_id:
          type: integer
          format: int64
          minimum: 1
        kind:
          $ref: '#/components/schemas/FinanceRecordKind'
        document_id:
          type: integer
          format: int64
          minimum: 1
        document_kind:
          $ref: '#/components/schemas/DocumentKind'
        document_no:
          type: string
        party_name:
          type: string
          description: 登记时的主往来单位名称快照。
        business_user:
          $ref: '#/components/schemas/UserSummary'
        business_date:
          type: string
          format: date
          description: 单据业务日期快照。
        amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 本次付款 / 收款 / 开票金额定点字符串，精确到分，且严格大于 0。
        amount_upper:
          type: string
          description: 金额的人民币大写。
        occurred_on:
          type: string
          format: date
          description: 实际发生日期，用户可手写多种格式，服务端统一归一化。
        method:
          allOf:
            - $ref: '#/components/schemas/FinanceMethod'
          nullable: true
        method_note:
          type: string
          maxLength: 100
          nullable: true
          description: 转账方式的备注（微信 / 支付宝）。
        card_tail:
          type: string
          pattern: '^\\d{4}$'
          nullable: true
          description: 对私卡卡号后 4 位；完整卡号不进入系统。
        invoice_no:
          type: string
          maxLength: 64
          nullable: true
        remark:
          type: string
          maxLength: 500
          nullable: true
        created_by:
          $ref: '#/components/schemas/UserSummary'
        created_at:
          type: string
          format: date-time
    FinanceRecordPageData:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceRecordData'
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0
    FinanceStatementData:
      type: object
      additionalProperties: false
      description: 单据结清视图。三类金额与开票状态全部由服务端按记录合计推导；不适用的单据方向恒为 0，其中开票状态为 not_applicable。
      required:
        - document_id
        - document_kind
        - document_no
        - party_name
        - business_user
        - business_date
        - total_amount
        - total_amount_upper
        - paid_amount
        - unpaid_amount
        - paid_amount_upper
        - unpaid_amount_upper
        - invoiced_amount
        - uninvoiced_amount
        - invoiced_amount_upper
        - uninvoiced_amount_upper
        - invoice_status
        - received_amount
        - unreceived_amount
        - received_amount_upper
        - unreceived_amount_upper
        - payment_count
        - receipt_count
        - invoice_count
        - records
      properties:
        document_id:
          type: integer
          format: int64
          minimum: 1
        document_kind:
          $ref: '#/components/schemas/DocumentKind'
        document_no:
          type: string
        party_name:
          type: string
        business_user:
          $ref: '#/components/schemas/UserSummary'
        business_date:
          type: string
          format: date
        total_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
        total_amount_upper:
          type: string
        paid_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 已付金额；出库单恒为 0。
        unpaid_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 未付金额 = 单据总额 − 已付；出库单恒为 0。
        paid_amount_upper:
          type: string
        unpaid_amount_upper:
          type: string
        invoiced_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 已开票金额；出库单恒为 0。
        uninvoiced_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 未开票金额 = 单据总额 − 已开票；出库单恒为 0。
        invoiced_amount_upper:
          type: string
        uninvoiced_amount_upper:
          type: string
        invoice_status:
          $ref: '#/components/schemas/InvoiceStatus'
        received_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 已收金额；入库单恒为 0。
        unreceived_amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 未收金额 = 单据总额 − 已收；入库单恒为 0。
        received_amount_upper:
          type: string
        unreceived_amount_upper:
          type: string
        payment_count:
          type: integer
          minimum: 0
        receipt_count:
          type: integer
          minimum: 0
        invoice_count:
          type: integer
          minimum: 0
        records:
          type: array
          items:
            $ref: '#/components/schemas/FinanceRecordData'
    FinanceStatementApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FinanceStatementData'
    FinanceRecordPageApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FinanceRecordPageData'
    CreateFinanceRecordRequest:
      type: object
      additionalProperties: false
      description: 登记付款 / 收款 / 开票的请求体。刻意不接受 kind 字段：记录类型由路由决定，否则客户端就能用付款接口写入收款数据。
      required: [document_id, amount, occurred_on]
      properties:
        document_id:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: string
          pattern: '^-?\\d{1,16}(\\.\\d{1,2})?$'
          description: 金额定点字符串（如 "30000.00"），必须大于 0；用「撤销后重录」表达纠错，而不是登记负数。
        occurred_on:
          type: string
          description: 实际发生日期，兼容 2026-09-22 / 2026/9/22 / 2026 9 22 / 2026年9月22日 / 20260922。
        method:
          allOf:
            - $ref: '#/components/schemas/FinanceMethod'
          nullable: true
          description: 仅付款 / 收款携带；开票携带会返回 VALIDATION_FAILED。
        method_note:
          type: string
          maxLength: 100
          nullable: true
          description: 仅转账方式可填。
        card_tail:
          type: string
          pattern: '^\\d{4}$'
          nullable: true
          description: 仅对私卡方式必填，且只允许 4 位数字。
        invoice_no:
          type: string
          maxLength: 64
          nullable: true
          description: 仅开票可填。
        remark:
          type: string
          maxLength: 500
          nullable: true
