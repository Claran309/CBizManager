openapi: 3.0.3
info:
  title: CBizDocsManager API
  version: 1.0.0
  description: 公务单据管理系统后端 API v1 契约。
servers:
  - url: /
tags:
  - name: Auth
    description: 认证与当前用户
  - name: Platform
    description: 平台管理
  - name: Group
    description: 组内管理
  - name: Health
    description: 服务健康检查
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenApiResponse'
        '400':
          description: 请求参数错误（VALIDATION_FAILED）
          x-error-codes: [VALIDATION_FAILED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '401':
          description: 用户名或密码错误（AUTH_INVALID_CREDENTIALS）
          x-error-codes: [AUTH_INVALID_CREDENTIALS]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 使用邀请码注册组内子账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterApiResponse'
        '400':
          description: 请求或邀请码无效（VALIDATION_FAILED、INVITATION_INVALID、INVITATION_EXPIRED、INVITATION_USED）
          x-error-codes:
            - VALIDATION_FAILED
            - INVITATION_INVALID
            - INVITATION_EXPIRED
            - INVITATION_USED
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '409':
          description: 用户名已存在（USER_USERNAME_EXISTS）
          x-error-codes: [USER_USERNAME_EXISTS]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 刷新访问令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenApiResponse'
        '400':
          description: 请求参数错误（VALIDATION_FAILED）
          x-error-codes: [VALIDATION_FAILED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '401':
          description: 刷新令牌无效或已过期（AUTH_REFRESH_INVALID、AUTH_TOKEN_EXPIRED）
          x-error-codes: [AUTH_REFRESH_INVALID, AUTH_TOKEN_EXPIRED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销当前会话
      responses:
        '200':
          description: 注销成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutApiResponse'
        '401':
          $ref: '#/components/responses/TokenExpired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户与所属组摘要
      responses:
        '200':
          description: 查询成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeApiResponse'
        '401':
          $ref: '#/components/responses/TokenExpired'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/password:
    put:
      tags: [Auth]
      operationId: changePassword
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码修改成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangedApiResponse'
        '400':
          description: 请求参数错误（VALIDATION_FAILED）
          x-error-codes: [VALIDATION_FAILED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '401':
          description: 当前密码错误或访问令牌已过期（AUTH_INVALID_CREDENTIALS、AUTH_TOKEN_EXPIRED）
          x-error-codes: [AUTH_INVALID_CREDENTIALS, AUTH_TOKEN_EXPIRED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/platform/groups:
    post:
      tags: [Platform]
      operationId: createGroup
      summary: 平台管理员创建组及主账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: 组与主账号创建成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateGroupApiResponse'
        '400':
          description: 请求参数错误（VALIDATION_FAILED）
          x-error-codes: [VALIDATION_FAILED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '401':
          $ref: '#/components/responses/TokenExpired'
        '403':
          description: 无平台管理权限或必须先修改初始密码（FORBIDDEN、AUTH_PASSWORD_CHANGE_REQUIRED）
          x-error-codes: [FORBIDDEN, AUTH_PASSWORD_CHANGE_REQUIRED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '409':
          description: 组名或主账号用户名已存在（GROUP_NAME_EXISTS、USER_USERNAME_EXISTS）
          x-error-codes: [GROUP_NAME_EXISTS, USER_USERNAME_EXISTS]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/groups/invitations:
    post:
      tags: [Group]
      operationId: createInvitation
      summary: 组主账号创建子账号邀请码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 邀请码创建成功；明文邀请码仅在本响应返回
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationApiResponse'
        '400':
          description: 请求参数错误（VALIDATION_FAILED）
          x-error-codes: [VALIDATION_FAILED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '401':
          $ref: '#/components/responses/TokenExpired'
        '403':
          description: 无组管理权限或必须先修改初始密码（FORBIDDEN、AUTH_PASSWORD_CHANGE_REQUIRED）
          x-error-codes: [FORBIDDEN, AUTH_PASSWORD_CHANGE_REQUIRED]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: 进程存活检查
      security: []
      responses:
        '200':
          description: 服务进程存活
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 服务就绪检查
      security: []
      responses:
        '200':
          description: 服务及关键依赖已就绪
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
        '503':
          description: 关键依赖未就绪（INTERNAL_ERROR）
          x-error-codes: [INTERNAL_ERROR]
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthApiResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    RequestID:
      description: 本次请求的唯一追踪 ID
      schema:
        type: string
  responses:
    TokenExpired:
      description: 访问令牌无效或已过期（AUTH_TOKEN_EXPIRED）
      x-error-codes: [AUTH_TOKEN_EXPIRED]
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    InternalError:
      description: 服务内部错误（INTERNAL_ERROR）
      x-error-codes: [INTERNAL_ERROR]
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - AUTH_INVALID_CREDENTIALS
        - AUTH_TOKEN_EXPIRED
        - AUTH_REFRESH_INVALID
        - AUTH_PASSWORD_CHANGE_REQUIRED
        - USER_USERNAME_EXISTS
        - INVITATION_INVALID
        - INVITATION_EXPIRED
        - INVITATION_USED
        - GROUP_NAME_EXISTS
        - FORBIDDEN
        - INTERNAL_ERROR
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    ApiResponse:
      type: object
      required: [code, message, data, request_id]
      properties:
        code:
          type: string
          description: 成功标识或稳定错误码
        message:
          type: string
        data:
          type: object
          nullable: true
          additionalProperties: true
        request_id:
          type: string
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ErrorApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          required: [code, message, data, request_id]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            data:
              type: object
              nullable: true
            field_errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [invitation_code, username, password, display_name]
      properties:
        invitation_code:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 8
        display_name:
          type: string
          minLength: 1
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          minLength: 1
        new_password:
          type: string
          format: password
          minLength: 8
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required: [name, owner_username, owner_display_name, owner_temporary_password]
      properties:
        name:
          type: string
          minLength: 1
        owner_username:
          type: string
          minLength: 1
        owner_display_name:
          type: string
          minLength: 1
        owner_temporary_password:
          type: string
          format: password
          minLength: 8
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_days:
          type: integer
          minimum: 1
          maximum: 30
          default: 7
    TokenData:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, access_expires_at, refresh_expires_at]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    UserSummary:
      type: object
      additionalProperties: false
      required: [id, username, display_name, account_type]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        username:
          type: string
        display_name:
          type: string
        account_type:
          type: string
          enum: [platform_admin, group_owner, member]
    GroupSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
    AuthTokenApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenData'
    RegisterData:
      type: object
      additionalProperties: false
      required: [user, group]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        group:
          $ref: '#/components/schemas/GroupSummary'
    RegisterApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/RegisterData'
    LogoutData:
      type: object
      additionalProperties: false
      required: [logged_out]
      properties:
        logged_out:
          type: boolean
    LogoutApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LogoutData'
    MeData:
      type: object
      additionalProperties: false
      required: [user, group, member_type, must_change_password]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        group:
          allOf:
            - $ref: '#/components/schemas/GroupSummary'
          nullable: true
        member_type:
          type: string
          enum: [owner, member]
          nullable: true
        must_change_password:
          type: boolean
    MeApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeData'
    PasswordChangedData:
      type: object
      additionalProperties: false
      required: [changed]
      properties:
        changed:
          type: boolean
    PasswordChangedApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PasswordChangedData'
    GroupCreatedData:
      type: object
      additionalProperties: false
      required: [group, owner]
      properties:
        group:
          $ref: '#/components/schemas/GroupSummary'
        owner:
          $ref: '#/components/schemas/UserSummary'
    CreateGroupApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GroupCreatedData'
    InvitationCreatedData:
      type: object
      additionalProperties: false
      required: [invitation_id, invitation_code, group, expires_at]
      properties:
        invitation_id:
          type: integer
          format: int64
          minimum: 1
        invitation_code:
          type: string
          description: 邀请码明文；后续查询不得再次返回
        group:
          $ref: '#/components/schemas/GroupSummary'
        expires_at:
          type: string
          format: date-time
    CreateInvitationApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/InvitationCreatedData'
    HealthData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        mysql:
          type: string
          enum: [up, down]
        redis:
          type: string
          enum: [up, down, disabled]
    HealthApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/HealthData'
