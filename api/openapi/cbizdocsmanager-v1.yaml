          properties:
            data:
              $ref: '#/components/schemas/GroupPageData'
    GroupSummaryApiResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/GroupSummaryData'
    OwnerCandidateData:
