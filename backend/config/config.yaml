app:
  name: CBizDocsManager
  env: development
  log_level: info

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s

mysql:
  dsn: root:change-me@tcp(127.0.0.1:3306)/cbizdocsmanager?charset=utf8mb4&parseTime=true&loc=UTC
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 3s
  write_timeout: 3s

jwt:
  issuer: cbizdocsmanager
  access_ttl: 30m
  refresh_ttl: 168h

cors:
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  allowed_methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
  allowed_headers: [Authorization, Content-Type, X-Request-ID, X-CSRF-Token]
  allow_credentials: true
  max_age: 12h

web_auth:
  enabled: true
  secure: false
  allowed_origins:
    - http://localhost:3000
    - http://127.0.0.1:3000
  cookie_domain: ""
  refresh_cookie_name: cbiz_refresh
  csrf_cookie_name: cbiz_csrf

invitation:
  encryption_key: ""
